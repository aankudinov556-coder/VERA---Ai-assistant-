name: Build Windows installer

on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Упаковщик установщика NSIS Tauri скачивает с GitHub; кешируем, чтобы не зависеть от сбоев сети
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ runner.os }}-v1

      - run: npm ci

      - name: Build (до 3 попыток при сетевых сбоях)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run tauri build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Попытка $i не удалась, повтор через 20 с..."
            Start-Sleep -Seconds 20
          }
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: VERA-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
